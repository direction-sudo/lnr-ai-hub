<div class="ml-auto flex items-center gap-2">
<span class="px-3 py-1 rounded-full text-xs font-medium ${a.status==='online'?'bg-green-500/10 text-green-400 border border-green-500/20':a.status==='busy'?'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20':'bg-red-500/10 text-red-400 border border-red-500/20'}">${a.status==='online'?'En ligne':a.status==='busy'?'Occupe':'Hors ligne'}</span>
<button onclick="toggleAgent('${a.id}')" class="px-4 py-2 rounded-lg text-xs font-semibold ${a.status==='online'?'bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20':'bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20'} transition-all">
${a.status==='online'?'<i class="fa-solid fa-power-off mr-1"></i>Arreter':'<i class="fa-solid fa-power-off mr-1"></i>Demarrer'}
</button>
</div>
</div>

<div class="grid grid-cols-4 gap-4">
${[['Taches','fa-list-check',a.tasks,a.color],['Efficacite','fa-bolt',a.efficiency+'%',a.color],['Actions en attente','fa-hourglass-half',a.actions.filter(x=>x.type==='validation').length,'#F59E0B'],['Alertes','fa-triangle-exclamation',a.actions.filter(x=>x.type==='alert').length,'#EF4444']].map(([label,icon,value,color])=>`
<div class="p-4 rounded-xl bg-white/[0.02] text-center">
<i class="fa-solid ${icon} text-lg mb-2" style="color:${color};opacity:0.8"></i>
<p class="text-xl font-bold">${value}</p>
<p class="text-[10px] text-white/30 mt-1">${label}</p>
</div>`).join('')}
</div>
</div>

<div class="grid lg:grid-cols-2 gap-6">
<div class="glass rounded-2xl p-6">
<h4 class="text-sm font-semibold mb-4">Actions en attente</h4>
${a.actions.length?a.actions.map(action=>`
<div class="p-4 rounded-xl bg-white/[0.02] border border-white/5 mb-3 log-entry">
<div class="flex items-start gap-3">
<div class="w-8 h-8 rounded-lg ${action.type==='validation'?'bg-gold/10':'bg-red-500/10'} flex items-center justify-center flex-shrink-0">
<i class="fa-solid ${action.type==='validation'?'fa-check-double':'fa-triangle-exclamation'} text-xs ${action.type==='validation'?'text-gold':'text-red-400'}"></i>
</div>
<div class="flex-1">
<p class="text-xs text-white/70 leading-relaxed mb-2">${action.text}</p>
<div class="flex items-center gap-2">
<span class="text-[10px] text-white/30">${action.time}</span>
<span class="text-[10px] px-1.5 py-0.5 rounded ${action.priority==='high'?'bg-red-500/10 text-red-400':'bg-yellow-500/10 text-yellow-400'}">${action.priority==='high'?'Haute':'Moyenne'}</span>
</div>
</div>
</div>
<div class="flex gap-2 mt-3 pl-11">
<button onclick="validateAction('${a.id}','${action.text}')" class="flex-1 py-2 rounded-lg bg-gold/10 hover:bg-gold/20 text-gold text-xs font-semibold transition-all border border-gold/20">Valider</button>
<button onclick="rejectAction('${a.id}','${action.text}')" class="flex-1 py-2 rounded-lg bg-white/5 hover:bg-red-500/10 text-white/50 hover:text-red-400 text-xs font-semibold transition-all border border-white/5">Rejeter</button>
</div>
</div>`).join(''):`<p class="text-xs text-white/30 text-center py-8">Aucune action en attente</p>`}
</div>

<div class="glass rounded-2xl p-6">
<h4 class="text-sm font-semibold mb-4">Journal d'activite</h4>
<div class="space-y-3">
${[['14:30','Validation du transfert B2C #1245','success'],['14:25','Alerte: Taux conversion B2B en baisse','warning'],['14:15','Mise a jour des parametres VoIP','info'],['14:00','Demarrage du shift','success'],['13:45','Analyse des leads en attente','info']].map(([time,msg,type])=>`
<div class="flex items-center gap-3 text-xs log-entry">
<span class="text-white/30 font-mono text-[10px]">${time}</span>
<div class="w-1.5 h-1.5 rounded-full ${type==='success'?'bg-green-400':type==='warning'?'bg-yellow-400':'bg-blue-400'}"></div>
<span class="text-white/60">${msg}</span>
</div>`).join('')}
</div>
</div>
</div>
</div>`}
</div>`;}

function renderActionsView(){return`
<div class="space-y-6 slide-in">
<div>
<h2 class="text-xl font-bold">Actions a Valider</h2>
<p class="text-sm text-white/40 mt-0.5">Toutes les actions necessitant une intervention humaine</p>
</div>
<div class="space-y-4">
${AGENTS.filter(a=>a.actions.length>0).map(a=>a.actions.map(action=>`
<div class="glass rounded-2xl p-5 card-hover log-entry">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style="background:${a.color}15">
<i class="fa-solid ${a.icon}" style="color:${a.color}"></i>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-1">
<span class="text-sm font-semibold">${a.name}</span>
<span class="text-[10px] px-2 py-0.5 rounded-full bg-white/5 text-white/40">${a.role}</span>
</div>
<p class="text-sm text-white/70 leading-relaxed mb-3">${action.text}</p>
<div class="flex items-center gap-3 mb-4">
<span class="text-[10px] text-white/30"><i class="fa-regular fa-clock mr-1"></i>${action.time}</span>
<span class="text-[10px] px-2 py-0.5 rounded-full ${action.priority==='high'?'bg-red-500/10 text-red-400 border border-red-500/20':'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'}">${action.priority==='high'?'Priorite Haute':'Priorite Moyenne'}</span>
</div>
<div class="flex gap-3">
<button onclick="validateAction('${a.id}','${action.text}')" class="px-6 py-2.5 rounded-xl bg-gold/10 hover:bg-gold/20 text-gold text-sm font-semibold transition-all border border-gold/20 flex items-center gap-2">
<i class="fa-solid fa-check"></i>Valider
</button>
<button onclick="rejectAction('${a.id}','${action.text}')" class="px-6 py-2.5 rounded-xl bg-white/5 hover:bg-red-500/10 text-white/50 hover:text-red-400 text-sm font-semibold transition-all border border-white/5 flex items-center gap-2">
<i class="fa-solid fa-xmark"></i>Rejeter
</button>
<button onclick="showToast('Action deleguee a '+agents.find(x=>x.id==='${a.id}').name,'info')" class="px-6 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-white/50 text-sm font-semibold transition-all border border-white/5 flex items-center gap-2">
<i class="fa-solid fa-user-clock"></i>Deleguer
</button>
</div>
</div>
</div>
</div>`).join('')).join('')||`<div class="text-center py-16"><i class="fa-solid fa-clipboard-check text-4xl text-white/10 mb-4"></i><p class="text-white/30">Aucune action en attente</p></div>`}
</div>
</div>`;}

function renderSettingsView(){return`
<div class="space-y-6 slide-in max-w-2xl">
<div>
<h2 class="text-xl font-bold">Parametres</h2>
<p class="text-sm text-white/40 mt-0.5">Configuration de la console de pilotage</p>
</div>
<div class="glass rounded-2xl p-6 space-y-6">
<div>
<h3 class="text-sm font-semibold mb-4">Notifications</h3>
<div class="space-y-3">
${[['Alertes critiques','Recevoir une notification pour chaque alerte critique','true'],['Actions en attente','Notification quand une action necessite validation','true'],['Rapports quotidiens','Resume quotidien des performances','false']].map(([label,desc,enabled])=>`
<div class="flex items-center justify-between p-3 rounded-xl bg-white/[0.02]">
<div>
<p class="text-sm font-medium">${label}</p>
<p class="text-[11px] text-white/40">${desc}</p>
</div>
<button class="relative w-11 h-6 rounded-full transition-all ${enabled==='true'?'bg-gold/20':'bg-white/5'}" style="border:1px solid ${enabled==='true'?'rgba(212,168,83,0.3)':'rgba(255,255,255,0.1)'}">
<div class="absolute top-0.5 ${enabled==='true'?'left-6':'left-0.5'} w-5 h-5 rounded-full bg-gold transition-all"></div>
</button>
</div>`).join('')}
</div>
</div>
<div class="h-px bg-white/5"></div>
<div>
<h3 class="text-sm font-semibold mb-4">Seuils d'alerte</h3>
<div class="space-y-4">
<div>
<div class="flex justify-between text-xs mb-2"><span class="text-white/50">Taux de conversion minimum</span><span class="text-gold font-semibold">20%</span></div>
<div class="h-2 bg-white/5 rounded-full"><div class="h-full w-1/5 bg-gold rounded-full"></div></div>
</div>
<div>
<div class="flex justify-between text-xs mb-2"><span class="text-white/50">Temps de reponse max</span><span class="text-gold font-semibold">5 min</span></div>
<div class="h-2 bg-white/5 rounded-full"><div class="h-full w-3/5 bg-gold rounded-full"></div></div>
</div>
<div>
<div class="flex justify-between text-xs mb-2"><span class="text-white/50">File d'attente max</span><span class="text-gold font-semibold">30 leads</span></div>
<div class="h-2 bg-white/5 rounded-full"><div class="h-full w-3/4 bg-gold rounded-full"></div></div>
</div>
</div>
</div>
<div class="h-px bg-white/5"></div>
<div class="flex items-center justify-between">
<div>
<p class="text-sm font-medium text-red-400">Mode Maintenance</p>
<p class="text-[11px] text-white/40">Desactiver temporairement tous les agents</p>
</div>
<button onclick="toggleMaintenance()" class="px-4 py-2 rounded-lg text-xs font-semibold ${maintenanceMode?'bg-red-500/20 text-red-400 border border-red-500/30':'bg-white/5 text-white/60 border border-white/5'}">
${maintenanceMode?'Desactiver':'Activer'}
</button>
</div>
</div>
</div>`;}

function showToast(message,type='info'){const container=document.getElementById('toast-container');const toast=document.createElement('div');toast.className='toast-enter flex items-center gap-3 px-4 py-3 rounded-xl glass border border-white/10 shadow-xl max-w-sm';toast.innerHTML=`<div class="w-8 h-8 rounded-lg ${type==='success'?'bg-green-500/10':type==='error'?'bg-red-500/10':'bg-gold/10'} flex items-center justify-center flex-shrink-0"><i class="fa-solid ${type==='success'?'fa-check':type==='error'?'fa-xmark':'fa-info'} text-xs ${type==='success'?'text-green-400':type==='error'?'text-red-400':'text-gold'}"></i></div><p class="text-xs font-medium text-white/80">${message}</p>`;container.appendChild(toast);setTimeout(()=>{toast.classList.remove('toast-enter');toast.classList.add('toast-exit');setTimeout(()=>toast.remove(),300)},4000);}

function setView(view){currentView=view;renderApp();}
function selectAgent(id){selectedAgent=id;setView('supervision');}

function toggleAgent(id){const a=AGENTS.find(x=>x.id===id);if(a){a.status=a.status==='online'?'offline':'online';showToast(`${a.name} ${a.status==='online'?'active':'desactive'}`,a.status==='online'?'success':'info');renderApp();}}

function validateAction(agentId,actionText){showToast('Action validee avec succes','success');const a=AGENTS.find(x=>x.id===agentId);if(a)a.actions=a.actions.filter(x=>x.text!==actionText);renderApp();}
function rejectAction(agentId,actionText){showToast('Action rejetee','error');const a=AGENTS.find(x=>x.id===agentId);if(a)a.actions=a.actions.filter(x=>x.text!==actionText);renderApp();}

function toggleMaintenance(){maintenanceMode=!maintenanceMode;if(maintenanceMode){AGENTS.forEach(a=>a.status='offline');showToast('Mode maintenance active — Tous les agents sont arretes','error');}else{AGENTS.forEach(a=>a.status='online');showToast('Mode maintenance desactive — Agents reactives','success');}renderApp();}

renderApp();
</script></body></html>
