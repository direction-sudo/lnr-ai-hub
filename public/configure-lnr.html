<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurer LNR Finance - LNR AI Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      color: #D4A853;
      font-size: 20px;
      margin-bottom: 8px;
      text-align: center;
    }
    p {
      color: #52525b;
      font-size: 13px;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      color: #a1a1aa;
      font-size: 11px;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0d0d0f;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px 14px;
      color: #D4A853;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: rgba(212,168,83,0.3);
    }
    input::placeholder {
      color: #3F3F46;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #D4A853, #C49A43);
      color: #0a0a0b;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .success {
      display: none;
      text-align: center;
      padding: 16px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 10px;
      margin-top: 16px;
    }
    .success.show { display: block; }
    .success h2 { color: #22C55E; font-size: 16px; margin-bottom: 8px; }
    .success p { color: #a1a1aa; margin-bottom: 0; }
    .info {
      background: rgba(212,168,83,0.06);
      border: 1px solid rgba(212,168,83,0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .info p {
      text-align: left;
      margin-bottom: 0;
      font-size: 11px;
      color: #a1a1aa;
    }
    .info strong { color: #fafafa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ Configurer LNR Finance</h1>
    <p>Collez votre Page Token pour activer la publication sur la page LNR Finance.</p>

    <div class="info">
      <p><strong>Page :</strong> LNR Finance<br>
      <strong>Page ID :</strong> 404269686112139<br>
      <strong>Fans :</strong> 2 125</p>
    </div>

    <label for="token">Page Token de LNR Finance</label>
    <input
      type="text"
      id="token"
      placeholder="EAAbwIHdWm5IBSCALLJnLrRNcgZA..."
      value="EAAbwIHdWm5IBSCALLJnLrRNcgZAKJQlV6UXYUIivQfiEyWrwrLyrlW7oJwzTikzpKVIkceaCyZCanwgsS6N2Rj338AvZArHSJWq7zTWZBqBLRRc6iKmKvPhj3vTM66RufrVDi58tPHHK1iho2vlUIZCWVkZBdIyZABHeiZAUdIxCLno3MsdhjLzNZBdZA5hkflYYZCgVHD4VqxT5QTZBYwkPCIfwIZC4A"
    >

    <button class="btn" id="configureBtn" onclick="configure()">
      Configurer LNR Finance
    </button>

    <div class="success" id="success">
      <h2>✅ Configuration réussie !</h2>
      <p>LNR Finance est maintenant configuré. Vous pouvez publier depuis Nora.</p>
      <p style="margin-top: 12px;">
        <a href="/dashboard/agents/nora" style="color: #D4A853; text-decoration: none; font-weight: 600;">
          Aller à Nora →
        </a>
      </p>
    </div>
  </div>

  <script>
    function configure() {
      const token = document.getElementById('token').value.trim();
      if (!token) {
        alert('Veuillez coller le Page Token');
        return;
      }

      // Store configuration
      localStorage.setItem('lnr_social_connections', JSON.stringify([
        {
          platform: 'facebook',
          connected: true,
          accessToken: token,
          pageId: '404269686112139',
          pageName: 'LNR Finance'
        }
      ]));

      document.getElementById('success').classList.add('show');
      document.getElementById('configureBtn').disabled = true;
      document.getElementById('configureBtn').textContent = 'Configuré !';
    }

    // Auto-fill from URL parameter
    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get('token');
    if (tokenFromUrl) {
      document.getElementById('token').value = tokenFromUrl;
    }
  </script>
</body>
</html>
