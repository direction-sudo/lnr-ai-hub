services:
  - type: web
    name: lnr-ai-hub-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    port: 3000
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        value: sqlite:/app/data/lnr-ai-hub.db
      - key: KIMI_OPEN_URL
        value: https://api.moonshot.ai
    disk:
      name: lnr-data
      mountPath: /app/data
      sizeGB: 1
